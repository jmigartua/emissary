[package]
name = "emissary"
version = "0.4.0"
description = "Emissary — a macOS-native browser and curation instrument for the radiometric emissometers database"
authors = ["Josu M. Igartua", "UPV/EHU"]
edition = "2021"

[lib]
name = "emissary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
